<section class="relative isolate {{surface}}" aria-labelledby="service-title">
  {{background}}
  <div class="page-container">
    <nav class="flex flex-wrap items-center gap-3 py-4 text-sm" aria-label="Breadcrumb">
      <a href="../index.html" aria-label="Home">
        <svg class="size-5" aria-hidden="true">
          <use href="../assets/images/icons.svg#breadcrumbs-home"></use>
        </svg>
      </a>
      <svg class="size-3" aria-hidden="true">
        <use href="../assets/images/icons.svg#chevron-right"></use>
      </svg>
      <span>Services</span>
      <svg class="size-3" aria-hidden="true">
        <use href="../assets/images/icons.svg#chevron-right"></use>
      </svg>
      <span class="font-semibold" aria-current="page">{{name}}</span>
    </nav>
    <div
      class="grid items-center gap-16 pt-8 pb-16 max-lg:gap-10 max-md:pt-4 max-md:pb-10 lg:grid-cols-5"
    >
      <div class="min-w-0 lg:col-span-3">
        <span class="eyebrow mb-4">{{eyebrow}}</span>
        <h1 class="mb-6 max-w-180" id="service-title">{{heading}}</h1>
        <p class="max-w-170 text-xl opacity-80 max-md:text-lg">{{description}}</p>
        {{visual}}
      </div>
      <div
        class="shadow-default text-primary w-full scroll-mt-40 rounded-2xl bg-white p-6 lg:col-span-2 lg:max-w-120 lg:justify-self-end"
        id="service-inquiry"
      >
        <div class="flex gap-3">
          <span class="icon-border size-10 shrink-0">
            <svg class="size-7" aria-hidden="true">
              <use href="../assets/images/icons.svg#{{icon}}"></use>
            </svg>
          </span>
          <div>
            <h2 class="text-base" id="service-form-title">{{formTitle}}</h2>
            <p class="text-brand-gray mt-2 text-xs">{{formDescription}}</p>
          </div>
        </div>
        {{form}}
      </div>
    </div>
  </div>
</section>
